<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
  <!-- 창고 입구. 핫스팟: 검문소 일지(13~38, 40~54) 경고문(64~86, 24~36) 경비 초소(118~141, 46~58) 조개껍데기(83~93, 84~90) -->
  <rect class="bg" width="160" height="100"/>
  <!-- 창고 벽과 큰 문 -->
  <path class="f1" d="M44 70 V18 L80 8 L116 18 V70 Z"/>
  <path class="ln2" d="M44 70 V18 L80 8 L116 18 V70"/>
  <rect class="f3" x="56" y="30" width="48" height="40"/>
  <path class="ln" d="M56 30 h48 v40 M80 30 V70 M56 40 H104 M56 50 H104 M56 60 H104" opacity="0.6"/>
  <!-- 경고문 -->
  <rect class="f2" x="65" y="25" width="20" height="10"/>
  <path class="ln" d="M67 28 h16 M67 31 h12"/>
  <path class="seal-ln" d="M67 33 c3 -1 7 1 12 -1"/>
  <!-- 검문소 차단기와 일지 상자 -->
  <rect class="f2" x="14" y="42" width="22" height="12"/>
  <path class="ln2" d="M14 42 h22 v12 h-22 z M25 54 V70"/>
  <path class="ln2" d="M36 46 H58" stroke-dasharray="3 2"/>
  <path class="ln" d="M17 45 h15 M17 48 h11"/>
  <!-- 경비 초소 -->
  <rect class="f2" x="118" y="38" width="24" height="32"/>
