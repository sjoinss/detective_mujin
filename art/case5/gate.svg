  <rect class="f3" x="121" y="46" width="18" height="11"/>
  <rect class="glow" x="121" y="46" width="18" height="11"/>
  <!-- 바닥과 안개 -->
  <rect class="f2" x="0" y="70" width="160" height="30" opacity="0.5"/>
  <path class="ln" d="M0 70 H160"/>
  <path class="ln" d="M0 62 c20 -3 40 3 60 0 s40 3 60 0 s30 2 40 0 M0 76 c25 -2 50 2 80 0 s50 2 80 0" opacity="0.45"/>
