<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
  <!-- 2층 계단. 핫스팟: 난간(64~112, 30~40) 검안 메모(96~118, 70~80) 유류품(29~48, 74~86) -->
  <rect class="bg" width="160" height="100"/>
  <rect class="f1" x="0" y="0" width="160" height="66"/>
  <!-- 위층 복도와 방송실 문 -->
  <rect class="f2" x="118" y="6" width="42" height="24"/>
  <rect class="f3" x="132" y="8" width="12" height="22"/>
  <path class="ln" d="M118 30 H160"/>
  <path class="ln2" d="M132 8 h12 v22 h-12 z"/>
  <!-- 계단: 아래 계단참에서 오른쪽 위로 -->
  <g>
    <path class="f2" d="M50 66 H62 V60 H70 V54 H78 V48 H86 V42 H94 V36 H102 V30 H118 V66 Z"/>
    <path class="ln2" d="M50 66 H62 V60 H70 V54 H78 V48 H86 V42 H94 V36 H102 V30 H118"/>
    <path class="ln" d="M62 66 V60 M70 66 V54 M78 66 V48 M86 66 V42 M94 66 V36 M102 66 V30" opacity="0.4"/>
  </g>
  <!-- 난간: 허리 높이 -->
  <path class="ln2" d="M58 44 L112 22"/>
  <path class="ln" d="M64 41.6 V58 M72 38.3 V55 M80 35 V51 M88 31.7 V45 M96 28.5 V39 M104 25.2 V33"/>
  <!-- 계단참 바닥 -->
  <rect class="f1" x="0" y="66" width="160" height="34" opacity="0.6"/>
  <path class="ln" d="M0 66 H160"/>
  <!-- 바닥 테이프 자국: 사람 모양 -->
  <path class="seal-ln" d="M66 84 c2 -4 7 -5 10 -3 l8 1 l8 -4 l3 2 l-7 5 l6 4 l-2 3 l-8 -4 l-9 2 c-4 2 -9 1 -9 -6 z"/>
  <circle class="seal-ln" cx="62" cy="83" r="3"/>
  <!-- 검안 메모: 클립보드 -->
  <rect class="f3" x="98" y="71" width="18" height="8" transform="rotate(-4 107 75)"/>
  <path class="ln2" d="M101 74 h11 M101 76.5 h8" transform="rotate(-4 107 75)"/>
  <rect class="lt" x="105" y="70.2" width="4" height="1.4" transform="rotate(-4 107 75)"/>
  <!-- 유류품 봉투 -->
  <path class="f2" d="M30 77 H47 V86 H30 Z"/>
  <path class="ln2" d="M30 77 H47 V86 H30 Z M30 77 L33 75 H44 L47 77"/>
  <rect class="ln" x="34" y="79" width="6" height="4"/>
</svg>
