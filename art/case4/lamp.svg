  <path class="ln" d="M0 6 L80 0 L160 6" />
  <!-- 램프와 점멸기 -->
  <rect class="f2" x="70" y="40" width="20" height="14"/>
  <path class="ln2" d="M70 40 h20 v14 h-20 z"/>
  <ellipse class="glow" cx="80" cy="34" rx="10" ry="6"/>
  <path class="ln2" d="M72 40 c0 -10 16 -10 16 0"/>
  <circle class="seal" cx="80" cy="34" r="2"/>
  <!-- 점멸 기록지 -->
  <path class="ln2" d="M88 50 c4 4 0 8 4 12 s0 8 4 10"/>
  <g class="lt"><rect x="89" y="54" width="1" height="1"/><rect x="90.5" y="56" width="2.5" height="1"/><rect x="92" y="60" width="1" height="1"/><rect x="93" y="64" width="2.5" height="1"/></g>
  <!-- 프레넬 렌즈와 거울 셋 -->
  <rect class="f3" x="104" y="22" width="22" height="32" rx="2"/>
  <g class="ln2"><path d="M107 26 h16 M106 32 h18 M106 38 h18 M106 44 h18 M107 50 h16"/></g>
  <g class="seal-ln"><path d="M110 51 l4 -4 M118 39 l-4 -4 M110 31 l4 -4"/></g>
  <!-- 바닥과 휜 난간 -->
  <rect class="f1" x="0" y="58" width="160" height="42"/>
  <path class="ln2" d="M0 58 H160"/>
  <path class="ln" d="M150 58 L160 50"/>
