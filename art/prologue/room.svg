<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
  <!-- 장기미제 기록실. 핫스팟: 사건부(64~93, 54~64) 책상 유리(19~45, 58~68) 모니터 메모(102~118, 30~40) 캐비닛(128~150, 20~70) -->
  <rect class="bg" width="160" height="100"/>
  <rect class="f1" x="0" y="0" width="160" height="72"/>
  <path class="ln" d="M0 72 H160"/>
  <!-- 창과 블라인드 -->
  <rect class="f2" x="14" y="8" width="56" height="34"/>
  <path class="ln" d="M14 12 H70 M14 16 H70 M14 20 H70 M14 24 H70 M14 28 H70 M14 32 H70 M14 36 H70" opacity="0.5"/>
  <path class="ln2" d="M14 8 h56 v34 h-56 z"/>
  <!-- 서류 상자 더미 -->
  <g class="f3"><rect x="76" y="30" width="18" height="12"/><rect x="78" y="18" width="16" height="12"/></g>
  <path class="ln" d="M76 30 h18 v12 h-18 z M78 18 h16 v12 h-16 z M82 24 h8 M80 36 h10"/>
  <!-- 긴 책상 -->
  <rect class="f3" x="14" y="64" width="100" height="3"/>
