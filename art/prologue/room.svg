  <rect class="lt" x="103" y="30" width="8" height="8" opacity="0.35" transform="rotate(6 107 34)"/>
  <!-- 철제 캐비닛 -->
  <rect class="f2" x="128" y="20" width="22" height="50"/>
  <path class="ln2" d="M128 20 h22 v50 h-22 z M128 37 H150 M128 54 H150"/>
  <rect class="ln2" x="136" y="58" width="6" height="4"/>
  <path class="ln" d="M137 28 h4 M137 45 h4"/>
</svg>
