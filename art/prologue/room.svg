  <!-- 책상 유리와 그 밑 목록 -->
  <rect class="f2" x="20" y="59" width="25" height="5" opacity="0.7"/>
  <path class="ln" d="M22 60.5 h18 M22 62.5 h14"/>
  <circle class="seal" cx="21.5" cy="60.5" r="0.6"/>
  <!-- 펼친 사건부: 인계 칸 한 줄 -->
  <path class="f2" d="M64 63 L66 55 H78 V63 Z M78 63 V55 H90 L92 63 Z"/>
  <path class="ln2" d="M64 63 L66 55 H90 L92 63 Z M78 55 V63"/>
  <path class="ln" d="M68 57.5 h8 M80 57.5 h8"/>
  <path class="seal-ln" d="M80 60.5 h8" stroke-dasharray="0.6 0.8"/>
  <!-- 모니터와 메모 -->
  <rect class="f3" x="98" y="34" width="22" height="16"/>
