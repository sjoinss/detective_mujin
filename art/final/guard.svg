<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">
  <!-- 야간 경비실. 핫스팟: 경비 수칙(16~38, 18~36) 순찰표(58~86, 50~60) 안쪽 창고(118~147, 20~70) -->
  <rect class="bg" width="160" height="100"/>
  <rect class="f1" x="0" y="0" width="160" height="70"/>
  <path class="ln" d="M0 70 H160"/>
  <!-- 경비 수칙 -->
  <rect class="f2" x="16" y="18" width="22" height="18"/>
  <path class="ln" d="M18.5 22 h17 M18.5 25.5 h14 M18.5 29 h17 M18.5 32.5 h11"/>
  <!-- 작은 창: 마당 쪽 -->
  <rect class="f2" x="46" y="14" width="28" height="20"/>
  <path class="ln2" d="M46 14 h28 v20 h-28 z M60 14 V34"/>
  <!-- 책상과 찢어진 순찰표 -->
  <rect class="f3" x="52" y="60" width="44" height="3"/>
  <path class="ln2" d="M52 60 H96 M55 63 V82 M93 63 V82"/>
  <g class="f2"><path d="M59 52 h6 l1 6 h-7 z"/><path d="M67 51 h7 l-1 7 h-6 z"/><path d="M75 52 h5 l1 6 h-6 z"/><path d="M81 53 h5 v5 h-5 z"/></g>
  <path class="ln" d="M60 54 h4 M68 53.5 h4 M76 54 h3 M82 55 h3"/>
  <!-- 의자: 아직 따뜻하다 -->
  <path class="ln" d="M100 76 h12 v-10 M100 76 v10 M112 76 v10"/>
  <!-- 안쪽 창고 문: 반쯤 열림 -->
  <rect class="f3" x="118" y="20" width="29" height="50"/>
  <path class="f2" d="M118 20 L132 24 V66 L118 70 Z"/>
  <path class="ln2" d="M118 20 h29 v50 h-29 z M118 20 L132 24 V66 L118 70"/>
  <rect class="glow" x="133" y="22" width="12" height="46"/>
  <path class="ln" d="M136 56 h8 M140 56 v-6" opacity="0.6"/>
</svg>
